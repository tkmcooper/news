{% extends "base.html" %}
{% block content %}
  <h1>Delete Article</h1>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ object.title }}"?</p>
    <button class="btn btn-danger" type="submit">Confirm</button>
    <a class="btn btn-secondary" href="{% url 'article_detail' object.pk %}">Cancel</a>
  </form>
{% endblock content %}
